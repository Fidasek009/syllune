<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="referrer" content="no-referrer" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Voices · Syllune</title>
	</head>
	<body>
		<main>
			<p class="brand"><img src="/icons/icon-48.png" alt="" width="28" height="28" /> Syllune</p>
			<h1>Choose your voice</h1>
			<p>Listen before you download. Once a voice is installed, speech works offline on your computer.</p>
			<div class="filters" role="search" aria-label="Filter voices">
				<label for="search"
					>Search
					<input id="search" type="search" placeholder="Voice name or language" autocomplete="off" />
				</label>
				<div class="filter">
					<span>Language</span>
					<button id="language" class="choice" type="button" data-label="Language">
						<span class="choice-label">All languages</span>
						<svg class="choice-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
					</button>
					<div id="language-menu" class="choice-menu" popover role="listbox" aria-label="Language" tabindex="-1"></div>
				</div>
				<div class="filter">
					<span>Quality</span>
					<button id="quality" class="choice" type="button" data-label="Quality">
						<span class="choice-label">All qualities</span>
						<svg class="choice-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
					</button>
					<div id="quality-menu" class="choice-menu" popover role="listbox" aria-label="Quality" tabindex="-1"></div>
				</div>
			</div>
			<p id="count"></p>
			<p id="status" role="status" aria-live="polite"></p>
			<div id="voices" role="region" aria-label="Voice models" aria-describedby="count"></div>
			<footer>
				Samples stream when you press a voice's play icon. Each model has its own license.
				<a href="notices.html" target="_blank" rel="noopener">Licenses and sources</a>
			</footer>
		</main>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
